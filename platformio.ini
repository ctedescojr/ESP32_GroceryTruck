; ============================================================
; platformio.ini — Grocery Truck ESP32
; Para upload e uso com ou sem display cyd, uitlize
; os comandos abaixo
; ============================================================

; # ─── Sem display ─────────────────────────────
; pio run -e grocery_truck
; pio run -e grocery_truck -t upload
; pio run -e grocery_truck -t uploadfs

# ─── Com display CYD ─────────────────────────
; pio run -e grocery_truck_cyd
; pio run -e grocery_truck_cyd -t upload
; pio run -e grocery_truck_cyd -t uploadfs 

[common]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
    esphome/ESPAsyncWebServer-esphome@^3.1.0
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -std=gnu++17

; ─── Sem display (comportamento atual) ───────────────────────────────────────
[env:grocery_truck]
extends = common

; ─── Com display CYD (ILI9341 240x320) ──────────────────────────────────────
[env:grocery_truck_cyd]
extends = common
lib_deps =
    ${common.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    ${common.build_flags}
    -DENABLE_DISPLAY
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_MISO=12
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DTOUCH_CS=33